<!-- Social/OG card derived from the ChargeVia mark on the near-black tile.
     For best cross-platform support, export a 1200x630 PNG before launch. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="ChargeVia — The stop that always works.">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35"/>
      <stop offset="100%" style="stop-color:#E85A24"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B6BB4"/>
      <stop offset="100%" style="stop-color:#7B5BA4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#111111"/>
  <g transform="translate(486,150)">
    <rect width="228" height="228" rx="52" fill="#1c1c1c"/>
    <path d="M66 66 L120 120 L66 174" stroke="url(#orangeGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M120 66 L174 120 L120 174" stroke="url(#purpleGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <text x="600" y="452" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="66" font-weight="700"><tspan fill="#FFFFFF">Charge</tspan><tspan fill="#FF6B35">Via</tspan></text>
  <text x="600" y="516" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="32" font-weight="400" fill="rgba(255,255,255,0.78)">The stop that always works.</text>
  <text x="600" y="560" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#8B6BB4">by Rangeway</text>
</svg>
